<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>直链</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
    }
    #status {
      margin: 0;
      line-height: 1.6;
      color: #94a3b8;
      text-align: center;
    }
    #hint {
      margin-top: 0.75rem;
      line-height: 1.6;
      color: #94a3b8;
      text-align: center;
    }
    #hint a {
      color: #38bdf8;
      text-decoration: none;
    }
    #hint a:hover {
      text-decoration: underline;
    }
    .error { color: #fca5a5; }
    .link-list {
      list-style: none;
      padding: 0;
      margin: 1.5rem 0 0;
    }
    .link-list a {
      display: block;
      padding: 0.875rem 1rem;
      border-radius: 0.5rem;
      background: #1e293b;
      color: #38bdf8;
      text-decoration: none;
      word-break: break-all;
      transition: background 0.15s ease;
    }
    .link-list a:hover { background: #334155; }
    .link-list li + li { margin-top: 0.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>直链</h1>
    <p id="status">正在检测网络环境…</p>
    <ul id="link-list" class="link-list" hidden></ul>
    <p id="hint" hidden></p>
  </main>
  <script>
    const TARGET_PORT = 5566;

    const isIpHost = (h) => /^(\d{1,3}\.){3}\d{1,3}$/.test(h || "");

    const isPrivateHost = (hostname) => {
      if (!hostname || hostname === "localhost") return true;
      if (hostname.endsWith(".local") || hostname.endsWith(".lan")) return true;
      const m = /^(\d+)\.(\d+)\.(\d+)\.(\d+)$/.exec(hostname);
      if (!m) return false;
      const [a, b] = [Number(m[1]), Number(m[2])];
      return a === 10 || a === 127 || (a === 172 && b >= 16 && b <= 31) || (a === 192 && b === 168);
    };

    const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const buildUrl = (host, port, scheme = "http") => scheme + "://" + host + ":" + port + "/";
    const apiBase = () => location.pathname.replace(/\/?$/, "/");

    async function fetchJson(path) {
      const res = await fetch(apiBase() + path, { cache: "no-store" });
      if (!res.ok) throw new Error("请求失败 (" + res.status + ")");
      return res.json();
    }

    function renderLinkList(items, host) {
      const status = document.getElementById("status");
      const list = document.getElementById("link-list");
      const network = isPrivateHost(host) ? "局域网" : "外网";

      status.textContent = items.length
        ? network + " IP 直连，点击打开"
        : "未扫描到可用端口（≥7000）";
      list.hidden = false;
      list.innerHTML = items
        .map(({ port, scheme }) => {
          const url = buildUrl(host, port, scheme || "http");
          return '<li><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(url) + "</a></li>";
        })
        .join("");
    }

    function redirectTo(url) {
      const status = document.getElementById("status");
      const hint = document.getElementById("hint");
      status.textContent = "正在跳转…";
      try {
        (window.top && window.top !== window ? window.top : window).location.replace(url);
      } catch {
        try {
          window.location.replace(url);
        } catch {
          status.textContent = "自动跳转失败，请手动打开：";
          hint.hidden = false;
          hint.innerHTML = '<a href="' + esc(url) + '" target="_top" rel="noopener noreferrer">' + esc(url) + "</a>";
        }
      }
    }

    (async function launch() {
      const status = document.getElementById("status");
      try {
        const hostname = location.hostname;

        if (isIpHost(hostname)) {
          const items = await fetchJson("api/services.json");
          if (!Array.isArray(items)) throw new Error("服务列表格式错误");
          renderLinkList(items, hostname);
          return;
        }

        const info = await fetchJson("api/info.json");
        const onLan = isPrivateHost(hostname);
        const ip = onLan ? info.lan_ip : info.wan_ip;
        const url = buildUrl(ip, info.port || TARGET_PORT);
        status.textContent = (onLan ? "局域网" : "外网") + "域名访问，正在打开 " + url;
        redirectTo(url);
      } catch (err) {
        status.className = "error";
        status.textContent = "启动失败：" + (err?.message || String(err));
      }
    })();
  </script>
</body>
</html>
